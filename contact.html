<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact me through my accessible portfolio contact form.">

    <meta name="author"
          content="Your Name">

    <title>Vandana T D | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                If you would like to contact me, please fill out
                the form below.
            </p>

            <form>

                <fieldset>

                    <legend>Contact Information</legend>

                    <p>
                        <label for="name">Full Name:</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true">
                    </p>

                    <p>
                        <label for="email">Email Address:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true">
                    </p>

                    <p>
                        <label for="subject">Subject:</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true">
                    </p>

                    <p>
                        <label for="message">Message:</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            cols="40"
                            required
                            aria-required="true"></textarea>
                    </p>

                    <button type="submit">
                        Send Message
                    </button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Vandana T D. All rights reserved.</p>
    </footer>

</body>
</html>
