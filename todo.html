<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Interactive JavaScript To-Do List application.">

    <title>To-Do List | Vandana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My To-Do List</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="todo.html" aria-current="page">To-Do List</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section aria-labelledby="todo-heading">

            <h2 id="todo-heading">Manage Your Tasks</h2>

            <form id="todo-form">

                <label for="task-input">
                    Enter a task
                </label>

                <input
                    type="text"
                    id="task-input"
                    name="task"
                    placeholder="What do you need to do?"
                    required
                    autocomplete="off">

                <button type="submit">
                    Add Task
                </button>

            </form>

            <div class="todo-controls">

                <button type="button" data-filter="all">
                    All
                </button>

                <button type="button" data-filter="active">
                    Active
                </button>

                <button type="button" data-filter="completed">
                    Completed
                </button>

            </div>

            <p id="task-count" aria-live="polite">
                0 tasks
            </p>

            <ul id="task-list" aria-label="To-do tasks">
            </ul>

            <button
                type="button"
                id="clear-completed">
                Clear Completed
            </button>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Vandana. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
